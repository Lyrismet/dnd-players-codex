# project-specific overrides on top of detekt's default ruleset (buildUponDefaultConfig = true)

naming:
  FunctionNaming:
    # matches the ktlint_function_naming_ignore_when_annotated_with override in .editorconfig
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # Composable UI builders idiomatically take many optional, defaulted styling params
    # (see Material3's own Button/TextField) - this is standard Compose shape, not a smell
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # AppPreferencesRepository is a flat bag of independent preference get/set pairs that grows one
    # pair at a time (numbering, mention style, edit mode, hold hint, two swipe hints, ...) - splitting
    # it would scatter the same simple pattern across several interfaces for no cohesion benefit
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerClass: 20

style:
  UnusedPrivateFunction:
    # a @Preview is only ever called by the IDE
    ignoreAnnotated: ['Preview']

coroutines:
  InjectDispatcher:
    # repositories use Dispatchers.Default directly and no test needs to swap it - turn this on together with
    # a DispatcherProvider if one ever does
    active: false
